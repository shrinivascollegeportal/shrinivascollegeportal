<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
      url('https://images.unsplash.com/photo-1523240795612-9a054b0db644') no-repeat center/cover;
    }

    .login-box {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 320px;
      color: white;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #00c6ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0072ff;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h2>Srinivas College Portal</h2>

  <input type="text"
  id="enrollment"
  placeholder="Enrollment Number">

  <input type="password"
  id="password"
  placeholder="Password">

  <button onclick="login()">
    Login
  </button>

</div>

<script>

// 🔥 LOGIN FUNCTION
function login(){

  let enrollment =
  document.getElementById("enrollment").value;

  let password =
  document.getElementById("password").value;

  // 🔥 GET STUDENTS
  let students =
  JSON.parse(localStorage.getItem("students")) || [];

  // 🔥 FIND STUDENT
  let student = students.find(s =>

    s.enrollment === enrollment &&
    s.password === password

  );

  // 🔥 LOGIN SUCCESS
  if(student){

    // save current student
    localStorage.setItem(
      "student",
      JSON.stringify(student)
    );

    // open dashboard
    window.location.href =
    "dashboard.html";

  }

  // 🔥 LOGIN FAILED
  else{

    alert("Wrong Enrollment or Password ❌");

  }

}

</script>

</body>
</html>
