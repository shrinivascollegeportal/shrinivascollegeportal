<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url("images/campus1.png");

background-size:cover;
background-position:center center;
background-repeat:no-repeat;

padding:20px;

}

.login-box{

width:100%;
max-width:360px;

padding:35px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(12px);

border-radius:15px;

text-align:center;

color:#fff;

box-shadow:0 10px 25px rgba(0,0,0,.35);

}

.login-box h2{

margin-bottom:25px;

font-size:30px;

}

input{

width:100%;

padding:12px;

margin:12px 0;

border:none;

border-radius:8px;

outline:none;

font-size:16px;

}

button{

width:100%;

padding:13px;

margin-top:10px;

background:#0072ff;

color:#fff;

border:none;

border-radius:8px;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0056cc;

}

@media(max-width:768px){

.login-box{

max-width:330px;

padding:25px;

}

.login-box h2{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="login-box">

<h2>Srinivas College Portal</h2>

<input
type="text"
id="enrollment"
placeholder="Enrollment Number">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<script>

function login(){

let enrollment=document.getElementById("enrollment").value;
let password=document.getElementById("password").value;

let students=
JSON.parse(localStorage.getItem("students")) || [];

let student=students.find(s=>

s.enrollment===enrollment &&
s.password===password

);

if(student){

localStorage.setItem(
"student",
JSON.stringify(student)
);

window.location.href="dashboard.html";

}

else{

alert("Wrong Enrollment or Password ❌");

}

}

</script>

</body>
</html>
